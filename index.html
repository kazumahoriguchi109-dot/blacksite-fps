<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BLACKSITE — Tactical FPS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d12'/%3E%3Cpath d='M16 5v22M5 16h22' stroke='%23ff8a3d' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e8eef5' stroke-width='2'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05070a; }
  body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #overlay {
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 40%, rgba(18,26,36,.92), rgba(3,5,8,.985) 70%);
    backdrop-filter: blur(6px);
    transition: opacity .45s cubic-bezier(.4,0,.2,1), visibility .45s;
  }
  #overlay.hidden { opacity:0; visibility:hidden; }
  .panel { text-align:center; max-width:640px; padding:0 32px; }
  .title {
    font-size:clamp(44px, 8vw, 92px); font-weight:800; letter-spacing:.16em;
    color:#e8eef5; text-shadow:0 0 40px rgba(120,190,255,.28); line-height:1;
  }
  .title span { color:#ff8a3d; }
  .sub { margin-top:14px; font-size:13px; letter-spacing:.42em; text-transform:uppercase; color:#7d8b9c; }
  .rule { height:1px; margin:28px auto; width:220px; background:linear-gradient(90deg,transparent,#3d5468,transparent); }
  .keys { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 28px; font-size:12.5px; color:#93a3b5; text-align:left; margin:0 auto 30px; max-width:440px; }
  .keys b { color:#dce6f0; font-weight:600; display:inline-block; min-width:74px; }
  .cta {
    pointer-events:auto; cursor:pointer; border:1px solid rgba(255,138,61,.55); background:rgba(255,138,61,.09);
    color:#ffcda6; font-size:13px; letter-spacing:.3em; text-transform:uppercase; padding:15px 42px;
    font-weight:600; transition:all .2s; font-family:inherit;
  }
  .cta:hover { background:rgba(255,138,61,.2); color:#fff; box-shadow:0 0 34px rgba(255,138,61,.28); }
  #loading { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#05070a; transition:opacity .6s; }
  #loading.done { opacity:0; pointer-events:none; }
  .bar { width:260px; height:2px; background:rgba(255,255,255,.09); overflow:hidden; margin-top:20px; }
  .bar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#ff8a3d,#ffd0a0); transition:width .25s; }
  .lmsg { font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:#59697c; margin-top:16px; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>

  <div id="overlay">
    <div class="panel">
      <div class="title">BLACK<span>SITE</span></div>
      <div class="sub">Tactical Response — Sector 7</div>
      <div class="rule"></div>
      <div class="keys">
        <div><b>WASD</b> Move</div><div><b>Shift</b> Sprint</div>
        <div><b>Ctrl / C</b> Crouch</div><div><b>Space</b> Jump</div>
        <div><b>Mouse</b> Look</div><div><b>LMB</b> Fire</div>
        <div><b>RMB</b> Aim (ADS)</div><div><b>R</b> Reload</div>
        <div><b>1 / 2 / 3</b> Weapon</div><div><b>G</b> Grenade</div>
        <div><b>Q / E</b> Lean</div><div><b>F</b> Flashlight</div>
        <div><b>V</b> Melee</div><div><b>Esc</b> Release cursor</div>
      </div>
      <button class="cta" id="startBtn">Deploy</button>
    </div>
  </div>

  <div id="loading">
    <div class="title" style="font-size:34px;letter-spacing:.3em">BLACKSITE</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="lmsg" id="lmsg">Initializing</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
